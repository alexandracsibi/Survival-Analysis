experiment_name: mnb_comprisk_deephit_risk2_ssl

dataset:
  name: mnb_comprisk
  base_dir: data/MNB
  feature_cols: null        # null => infer with infer_feature_cols(...)
  n_times: 50
  discretization: quantile

  loader:
    train_batch_size: 512
    val_batch_size: 1024
    shuffle_train: true
    num_workers: 4
    pin_memory: true

model:
  type: deephit
  mlp_hidden_dims: [256, 256]
  mlp_dropout: 0.3
  n_events: 2

train:
  optimizer: adam
  lr: 1.0e-3
  weight_decay: 1.0e-5
  epochs: 100
  device: cuda
  seed: 42

  early_stopping_patience: 20
  early_stopping_min_delta: 1.0e-4

  deephit_alpha: 1.0   # NLL
  deephit_beta: 0.2    # ranking

  ssl:
    enabled: true
    unlabeled_fraction: 0.4
    method: "pseudo_label"
    warmup_epochs: 10 
    ssl_epochs: 100
    lambda_pseudo: 0.2
    temperature: 0.8

    pseudo_refresh_interval: 5
    pseudo_refresh_min_size: 200   # if fewer than this accepted, keep previous pseudo set
    pseudo_refresh_max_size: 75000

    # threshold schedule
    confidence_threshold_start: 0.60
    confidence_threshold_end: 0.90
    confidence_schedule: "linear"
    conf_schedule_steps: 15  

    ema_enabled: true
    ema_decay: 0.999

metrics:
  horizon: 180.0
  horizons: [30.0, 90.0, 180.0, 365.0, 540.0]
  event_of_interest: 2