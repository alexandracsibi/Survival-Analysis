experiment_name: mnb_comprisk_deephit_60%
dataset:
  name: mnb_comprisk
  base_dir: data/MNB
  feature_cols: null
  n_times: 50
  discretization: quantile
  loader:
    train_batch_size: 512
    val_batch_size: 1024
    shuffle_train: true
    num_workers: 4
    pin_memory: true
model:
  type: deephit
  mlp_hidden_dims:
  - 256
  - 256
  mlp_dropout: 0.3
  n_events: 2
train:
  optimizer: adam
  lr: 0.001
  weight_decay: 1.0e-05
  epochs: 100
  device: cuda
  seed: 42
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0001
  deephit_alpha: 1.0
  deephit_beta: 0.2
  ssl:
    enabled: false
    unlabeled_fraction: 0.4
    method: pseudo_label
    warmup_epochs: 30
    ssl_epochs: 100
    lambda_pseudo: 0.1
    temperature: 0.8
    pseudo_refresh_interval: 10
    pseudo_refresh_min_size: 100
    confidence_threshold_start: 0.35
    confidence_threshold_end: 0.2
    confidence_schedule: linear
    conf_schedule_steps: 10
    ema_enabled: true
    ema_decay: 0.999
metrics:
  horizon: 180.0
  horizons:
  - 30.0
  - 90.0
  - 180.0
  - 365.0
  - 540.0
  event_of_interest: 1
