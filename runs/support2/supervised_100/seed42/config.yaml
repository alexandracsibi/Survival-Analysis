experiment_name: support2_deepsurv_seed42
dataset:
  name: support2
  base_dir: data/support2
  feature_cols: null
  loader:
    train_batch_size: 256
    val_batch_size: 512
    shuffle_train: true
    num_workers: 4
    pin_memory: true
model:
  type: deepsurv
  mlp_hidden_dims:
  - 256
  - 256
  mlp_dropout: 0.3
train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  epochs: 300
  device: cuda
  seed: 42
  early_stopping_patience: 30
  early_stopping_min_delta: 0.0001
metrics:
  horizon: 365.0
  horizons:
  - 60
  - 120
  - 250
  - 500
  - 750
  event_of_interest: 1
