experiment_name: support2_deepsurv_graphssl_seed45
dataset:
  name: support2
  base_dir: data/support2
  feature_cols: null
  loader:
    train_batch_size: 256
    val_batch_size: 512
    shuffle_train: true
    num_workers: 4
    pin_memory: true
model:
  type: deepsurv
  mlp_hidden_dims:
  - 256
  - 256
  mlp_dropout: 0.3
train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  epochs: 200
  device: cuda
  seed: 45
  graph_ssl:
    enabled: true
    k: 10
    lambda: 0.1
    max_neighbors: 5
    unlabeled_fraction: 0.5
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0001
  ssl:
    enabled: false
metrics:
  horizon: 365.0
  horizons:
  - 60
  - 120
  - 250
  - 500
  - 750
  event_of_interest: 1
