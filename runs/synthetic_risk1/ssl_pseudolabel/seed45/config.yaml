experiment_name: synthetic_deephit_ssl_seed45
dataset:
  name: synthetic
  base_dir: data/synthetic
  feature_cols: null
  n_times: 50
  discretization: linear
  loader:
    train_batch_size: 512
    val_batch_size: 1024
    shuffle_train: true
    num_workers: 4
    pin_memory: true
model:
  type: deephit
  mlp_hidden_dims:
  - 128
  - 64
  mlp_dropout: 0.1
  n_events: 2
train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  epochs: 200
  device: cuda
  seed: 45
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0001
  deephit_alpha: 1.0
  deephit_beta: 1.0
  ssl:
    enabled: true
    unlabeled_fraction: 0.8
    method: pseudo_label
    warmup_epochs: 50
    ssl_epochs: 100
    lambda_pseudo: 0.1
    temperature: 0.7
    pseudo_refresh_interval: 10
    pseudo_refresh_min_size: 100
    confidence_threshold_start: 0.35
    confidence_threshold_end: 0.15
    confidence_schedule: linear
    conf_schedule_steps: 10
    ema_enabled: true
    ema_decay: 0.99
metrics:
  horizon: 7.0
  horizons:
  - 3
  - 5
  - 7
  - 10
  - 14
  event_of_interest: 1
